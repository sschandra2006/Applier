services:
  mongodb:
    image: mongo:6.0
    container_name: applier-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: applier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: applier-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/applier
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_API_URL=http://ai-service:8000/api/v1/ai/execute
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  browser-worker:
    build:
      context: .
      dockerfile: browser-worker/Dockerfile
    container_name: applier-browser-worker
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/applier
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_API_URL=http://ai-service:8000/api/v1/ai/execute
      - WORKER_CONCURRENCY=2
    depends_on:
      - mongodb
      - redis
      - backend
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: applier-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - NODE_API_URL=http://backend:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: applier-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
